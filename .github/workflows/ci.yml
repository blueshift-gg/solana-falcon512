name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo +nightly fmt --check (lib)
        run: cargo +nightly fmt --check
      - name: cargo +nightly fmt --check (program)
        working-directory: program
        run: cargo +nightly fmt --check

  clippy:
    name: clippy (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo +nightly clippy (lib)
        run: cargo +nightly clippy --all-targets -- -D warnings
      - name: cargo +nightly clippy (program)
        working-directory: program
        run: cargo +nightly clippy --all-targets -- -D warnings

  kani:
    name: kani (formal verification)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings --cfg solana_falcon512_kani
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y z3
      # Pinned: a newer Kani's nightly turns `semicolon_in_expressions_from_non_local_macros`
      # into an error under the global `-D warnings` on the existing const-asserts.
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.67.0'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release --lib -p solana-falcon512
      - run: cargo test --locked --release -p host-tests
      - run: cargo test --locked --doc

  sbpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-build-sbf --version 4.2.0
      # A frame over 4 KiB is only a build warning, and Mollusk runs without
      # the stack gaps that turn it into an access violation on a validator,
      # so fail on the warning. v0 (fixed frames) as well as v3.
      - name: build-sbf (v0, no frame overflow)
        run: |
          set -o pipefail
          cargo build-sbf --manifest-path program/Cargo.toml 2>&1 | tee build-v0.log
          ! grep -q 'overflows the maximum allowed frame space' build-v0.log
      - name: build-sbf (v3, no frame overflow)
        run: |
          set -o pipefail
          cargo build-sbf --arch v3 --manifest-path program/Cargo.toml 2>&1 | tee build-v3.log
          ! grep -q 'overflows the maximum allowed frame space' build-v3.log
      - run: cargo test --locked -p program --test tests -- --nocapture
